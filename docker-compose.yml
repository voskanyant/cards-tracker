services:
  web:
    build: .
    container_name: cards-tracker-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8091:8000"
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    container_name: cards-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cards_tracker
      POSTGRES_USER: cards_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
